[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "alphaforge"
version = "0.1.0"
description = "Cross-platform strategy generation, backtesting, robustness testing and code export for systematic traders."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AlphaForge contributors" }]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
# Numba JIT-compiles the simulation kernel. Everything works without it,
# just slower; tests run both paths.
# llvmlite publishes no Intel macOS wheels; AlphaForge runs pure Python there.
fast = ["numba>=0.60; sys_platform != 'darwin' or platform_machine != 'x86_64'"]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27", "numba>=0.60; sys_platform != 'darwin' or platform_machine != 'x86_64'"]

[project.scripts]
alphaforge = "alphaforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
